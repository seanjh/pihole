---
services:
  pihole:
    image: pihole/pihole:2026.04.0
    container_name: pihole
    ports:
      - 53:53/tcp
      - 53:53/udp
      - 80:80/tcp
      - 443:443/tcp
    environment:
      TZ: America/New_York
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
    network_mode: host
    volumes: [./etc-pihole:/etc/pihole]
      - SYS_NICE
    restart: unless-stopped
  unbound:
    image: mvance/unbound:1.21.1
    container_name: unbound
    network_mode: host
    volumes: [./unbound:/opt/unbound/etc/unbound]
    restart: unless-stopped
